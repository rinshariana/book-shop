<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/app.css">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>

<body onload="onInit()">
    <header>
        <img src="img/svg/Thomas_und_Kurzberg_logo.svg" alt="logo">
        <h1>Book Shop</h1>
    </header>

    <main>
        <div class="actions">
            <input class="search-input" type="text" placeholder="Search by title" oninput="onFilterBooks(this)" />
            <button onclick="onClearFilter()">Clear</button>
            <button class="add-book" onclick="onAddBook()">+</button>
            <span>Add Book</span>
        </div>
        <div class="table"></div>
    </main>

    <footer>
        <span>Coffeerights 2026</span>
        <div class="stats">
            <span>expensive:</span>
            <span class="expensive-count">3</span>
            <span>average:</span>
            <span class="average-count">2</span>
            <span>cheap:</span>
            <span class="cheap-count">1</span>
        </div>
    </footer>

    <dialog class="update-modal">
        <form method="dialog">
            <p>Update book price</p>
            <input class="new-price" type="number" placeholder="Enter new price">
            <button onclick="onSavePrice()">Save</button>
        </form>
    </dialog>

    <dialog class="add-modal">
        <form method="dialog">
            <span>Add new book</span>
            <input class="name" type="text" placeholder="Enter book name">
            <input class="price" type="number" placeholder="Enter price">
            <button onclick="onSaveBook()">Save</button>
        </form>
    </dialog>

    <dialog class="details-modal">
        <form method="dialog">
            <button>x</button>
            <img src="" alt="book cover">
            <div class="rating"></div>
            <p>some thing about book</p>
        </form>
    </dialog>

    <dialog class="pop-up-modal">
        <span></span>
    </dialog>

    <script src="js/utils.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/config/assets.js"></script>
    <script src="js/services/storage.service.js"></script>
    <script src="js/services/app.service.js"></script>
</body>

</html>
